{{- if include "ghidra-server.generateKeystorePassword" . }}
{{- $name := include "ghidra-server.tlsPasswordSecretName" . }}
{{- $key := .Values.tls.passwordSecret.key }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "ghidra-server.labels" . | nindent 4 }}
  annotations:
    # cert-manager encrypts its keystore with this password; keep it stable across upgrades.
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- if and $existing (index $existing.data $key) }}
  {{ $key }}: {{ index $existing.data $key }}
  {{- else }}
  {{ $key }}: {{ randAlphaNum 32 | b64enc }}
  {{- end }}
{{- end }}
