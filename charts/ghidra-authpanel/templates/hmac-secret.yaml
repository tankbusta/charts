{{- if not .Values.hmacSecret.existingSecret }}
{{- $name := include "ghidra-authpanel.hmacSecretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "ghidra-authpanel.labels" . | nindent 4 }}
  annotations:
    # Session tokens are signed with this key; don't rotate it on uninstall/reinstall.
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- if and $existing (index $existing.data "ghidra_panel.secrets.json") }}
  ghidra_panel.secrets.json: {{ index $existing.data "ghidra_panel.secrets.json" }}
  {{- else }}
  ghidra_panel.secrets.json: {{ dict "hmac_secret" (randBytes 32) | toJson | b64enc }}
  {{- end }}
{{- end }}
